<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las Papas Queman - Galería de ST</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { color: #f97316; margin-bottom: 5px; }
        .caja-juego {
            background-color: #1e293b;
            border: 2px solid #334155;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }
        input, select {
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            margin: 10px 0;
            width: 80%;
        }
        .btn {
            background-color: #f97316;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }
        .btn:hover { background-color: #fb923c; }
        .silaba {
            font-size: 3rem;
            color: #facc15;
            font-weight: bold;
            margin: 15px 0;
            letter-spacing: 3px;
        }
        .vidas { color: #ef4444; font-size: 1.2rem; margin: 10px 0; }
        .tiempo { font-size: 1.5rem; color: #38bdf8; font-weight: bold; }
        .volver { margin-top: 20px; }
    </style>
</head>
<body>

    <h1> Las Papas Queman</h1>

    <!-- Pantalla de Configuración -->
    <div class="caja-juego" id="pantallaConfig">
        <h3>Configurar Partida</h3>
        <label>Cantidad de jugadores (2 a 6):</label><br>
        <select id="numJugadores" onchange="generarCamposNombres()">
            <option value="2">2 Jugadores</option>
            <option value="3">3 Jugadores</option>
            <option value="4">4 Jugadores</option>
            <option value="5">5 Jugadores</option>
            <option value="6">6 Jugadores</option>
        </select>
        <div id="camposNombres"></div>
        <button class="btn" onclick="empezarJuego()">¡Comenzar Juego!</button>
    </div>

    <!-- Pantalla de Partida -->
    <div class="caja-juego" id="pantallaPartida" style="display:none;">
        <h3 id="turnoActual">Turno de: </h3>
        <div class="vidas" id="vidasJugador">❤️❤️❤️</div>
        <div class="tiempo">⏰ <span id="tiempoRestante">6</span>s</div>
        <p>Escribe una palabra que contenga:</p>
        <div class="silaba" id="textoSilaba">TR</div>
        
        <input type="text" id="inputPalabra" placeholder="Escribe tu palabra..." autocomplete="off">
        <br>
        <button class="btn" onclick="enviarPalabra()">Enviar</button>
    </div>

    <!-- Pantalla de Victoria -->
    <div class="caja-juego" id="pantallaFin" style="display:none;">
        <h2 style="color: #4ade80;">🏆 ¡Tenemos Ganador!</h2>
        <p id="textoGanador" style="font-size: 1.4rem; font-weight: bold;"></p>
        <button class="btn" onclick="location.reload()">Jugar Otra Vez</button>
    </div>

    <div class="volver">
        <a href="../index.html" class="btn" style="background-color: #38bdf8; color: #0f172a; text-decoration: none; display:inline-block; padding: 10px 20px; border-radius: 6px;">Volver a la Galería</a>
    </div>

    <script>
        let jugadores = [];
        let turnoIndex = 0;
        let vidas = {};
        let silabas = ["TR", "CA", "PA", "LE", "BE", "TA", "AN", "OS", "RA", "MI", "UN", "AS", "ES", "TO","OL","CO","TO", "CO", "MA", "ME","NU", "AD"];
        let silabaActual = "";
        let tiempo = 6;
        let intervalo = null;
        let juegoActivo = false;

        function generarCamposNombres() {
            let n = document.getElementById("numJugadores").value;
            let html = "";
            for (let i = 1; i <= n; i++) {
                html += `<input type="text" id="jugador${i}" placeholder="Nombre Jugador ${i}" value="Jugador ${i}"><br>`;
            }
            document.getElementById("camposNombres").innerHTML = html;
        }
        generarCamposNombres();

        function empezarJuego() {
            let n = document.getElementById("numJugadores").value;
            jugadores = [];
            vidas = {};

            for (let i = 1; i <= n; i++) {
                let inputNombre = document.getElementById(`jugador${i}`);
                let nombre = inputNombre && inputNombre.value.trim() !== "" ? inputNombre.value.trim() : `Jugador ${i}`;
                jugadores.push(nombre);
                vidas[nombre] = 3;
            }

            turnoIndex = 0;
            document.getElementById("pantallaConfig").style.display = "none";
            document.getElementById("pantallaPartida").style.display = "block";
            juegoActivo = true;
            siguienteTurno();
        }

        function siguienteTurno() {
            if (!juegoActivo) return;

            // Saltar jugadores eliminados (0 vidas)
            let intentos = 0;
            while (vidas[jugadores[turnoIndex]] <= 0 && intentos < jugadores.length) {
                turnoIndex = (turnoIndex + 1) % jugadores.length;
                intentos++;
            }

            let jugadorActual = jugadores[turnoIndex];
            document.getElementById("turnoActual").innerText = "Turno de: " + jugadorActual;
            document.getElementById("vidasJugador").innerText = "❤️".repeat(vidas[jugadorActual]);
            
            silabaActual = silabas[Math.floor(Math.random() * silabas.length)];
            document.getElementById("textoSilaba").innerText = silabaActual;
            
            let input = document.getElementById("inputPalabra");
            input.value = "";
            input.focus();

            tiempo = 6;
            document.getElementById("tiempoRestante").innerText = tiempo;
            
            if (intervalo) clearInterval(intervalo);

            intervalo = setInterval(() => {
                tiempo--;
                document.getElementById("tiempoRestante").innerText = tiempo;
                if (tiempo <= 0) {
                    clearInterval(intervalo);
                    perderVida(jugadorActual);
                }
            }, 1000);
        }

        function perderVida(jugador) {
            vidas[jugador]--;
            alert(`💥 ¡Se acabó el tiempo! ${jugador} pierde una vida.`);
            
            let vivos = jugadores.filter(j => vidas[j] > 0);
            if (vivos.length === 1) {
                juegoActivo = false;
                if (intervalo) clearInterval(intervalo);
                document.getElementById("pantallaPartida").style.display = "none";
                document.getElementById("pantallaFin").style.display = "block";
                document.getElementById("textoGanador").innerText = "🎉 " + vivos[0] + " es el ganador de la partida.";
                return;
            }

            turnoIndex = (turnoIndex + 1) % jugadores.length;
            siguienteTurno();
        }

        function enviarPalabra() {
            if (!juegoActivo) return;
            let input = document.getElementById("inputPalabra");
            let palabra = input.value.trim().toUpperCase();
            
            if (palabra.includes(silabaActual) && palabra.length >= silabaActual.length) {
                if (intervalo) clearInterval(intervalo);
                turnoIndex = (turnoIndex + 1) % jugadores.length;
                siguienteTurno();
            } else {
                alert(`❌ Palabra inválida. Debe contener la sílaba "${silabaActual}".`);
                input.focus();
            }
        }

        // Detectar la tecla Enter en el input de texto
        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("inputPalabra");
            if(input) {
                input.addEventListener("keydown", function(e) {
                    if (e.key === "Enter") {
                        enviarPalabra();
                    }
                });
            }
        });
    </script>
</body>
</html>
